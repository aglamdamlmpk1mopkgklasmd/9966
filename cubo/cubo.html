<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D Interativo</title>
    <link rel="stylesheet" href="cubo.css">
</head>
<body>
    <a href="../index.html">Voltar para a página inicial</a>
    <main>
        <h1>Cubo 3D Interativo</h1>
        <p>HTML +CSS + JavaScript</p>
        <div class="cenario">
            <div class="cubo" id="cubo">
                <div class="face frente">1</div>
                <div class="face direita">2</div>
                <div class="face traseira">3</div> 
                <div class="face baixo">4</div>
                <div class="face cima">5</div>
                <div class="face esquerda">6</div>
            </div>
        </div>
        <div class="controle">
            <button class ="botoes" id="reset">Reset</button>
            <button class ="botoes" id="parar">Parar</button>
            <button class ="botoes" id="aumentar">Aumentar</button>
            <button class ="botoes" id="diminuir">Diminuir</button>
            <button class ="botoes" id="rapido">Aumentar Velocidade</button>
            <button class ="botoes" id="normal">Velocidade Normal</button>
            <button class ="botoes" id="lento">Diminuir Velocidade</button>
        </div>    
    </main>
    <script src="cubo.js"></script>
</body>
</html>
